    *{box-sizing:border-box} body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased} button,input,textarea{font:inherit} button{cursor:pointer} .wrap{max-width:480px;margin:0 auto;padding:16px 16px 92px}.hero{background:var(--dark);color:white;border-radius:24px;padding:18px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 10px 25px rgba(15,23,42,.18);margin-bottom:14px}.hero small{display:block;text-transform:uppercase;letter-spacing:.12em;color:#cbd5e1;font-weight:700;font-size:11px}.hero h1{font-size:22px;margin:3px 0 0}.card{background:var(--card);border-radius:24px;padding:16px;box-shadow:0 1px 3px rgba(15,23,42,.08);margin-bottom:14px}.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.stat{background:white;border-radius:18px;padding:10px;text-align:center;box-shadow:0 1px 3px rgba(15,23,42,.08)}.stat b{display:block;font-size:18px}.stat span{display:block;font-size:11px;color:var(--muted)}.workoutBtn{width:100%;text-align:left;border:1px solid var(--line);background:var(--soft);border-radius:18px;padding:15px;margin:8px 0}.workoutBtn b{display:block;font-size:18px}.workoutBtn span{display:block;color:#334155;font-weight:600;margin-top:2px}.workoutBtn small{display:block;color:var(--muted);margin-top:5px}.topbar{display:flex;justify-content:space-between;align-items:center;gap:8px}.btn{border:0;border-radius:14px;background:var(--dark);color:white;padding:11px 14px;font-weight:800}.btn.secondary{background:white;color:#334155;border:1px solid var(--line)}.btn.ok{background:var(--ok)}.btn.full{width:100%;padding:16px}.progress{height:9px;background:#e2e8f0;border-radius:999px;overflow:hidden;margin-top:12px}.progress div{height:100%;background:var(--dark);border-radius:999px}.center{text-align:center}.tiny{font-size:12px;color:var(--muted)}.label{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:800}.exerciseTitle{font-size:28px;line-height:1.05;margin:4px 0;font-weight:950}.target{font-weight:800;color:#334155}.note{background:var(--soft);border-radius:18px;padding:12px;color:#475569;font-size:14px}.guidance{background:var(--blue);color:var(--blueInk);border:1px solid #dbeafe;border-radius:18px;padding:12px;font-size:14px}.timer{display:flex;align-items:center;justify-content:space-between;gap:10px}.time{font-size:38px;font-weight:950;font-variant-numeric:tabular-nums}.timerBtns{display:flex;gap:8px}.round{border:0;border-radius:14px;background:var(--dark);color:white;padding:12px}.chips{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.chip{border:1px solid var(--line);background:var(--soft);border-radius:14px;padding:9px;font-weight:800;color:#334155}.set{border:1px solid var(--line);background:white;border-radius:18px;padding:12px;margin-bottom:10px}.set.done{background:#ecfdf5;border-color:#bbf7d0}.set.skipped{background:#f1f5f9}.setHead{display:flex;justify-content:space-between;margin-bottom:8px}.inputs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.inputs label{font-size:11px;font-weight:800;color:var(--muted)}.inputs input{width:100%;margin-top:4px;border:1px solid var(--line);border-radius:13px;padding:12px 10px;font-size:16px;outline:none}.actions2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.nav3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}.history{border:1px solid #f1f5f9;background:var(--soft);border-radius:16px;padding:10px;margin:7px 0}.hidden{display:none!important}.installBox{border:1px dashed #94a3b8;background:#f8fafc;border-radius:18px;padding:12px;font-size:14px;color:#334155}.danger{color:#b91c1c;background:white;border:1px solid #fecaca}.smallRow{display:flex;justify-content:space-between;gap:8px;align-items:center}.pill{display:inline-block;background:#e2e8f0;border-radius:999px;padding:4px 8px;font-size:12px;font-weight:700;color:#334155}.footer{position:fixed;bottom:0;left:0;right:0;background:rgba(241,245,249,.9);backdrop-filter:blur(10px);padding:10px 16px env(safe-area-inset-bottom);}.footerInner{max-width:480px;margin:0 auto;display:flex;gap:8px}.footerInner button{flex:1}.completeIcon{width:58px;height:58px;background:#d1fae5;color:#047857;border-radius:999px;display:flex;align-items:center;justify-content:center;margin:0 auto 12px;font-size:34px;font-weight:900}
  </style>

<body>
  <div class="wrap">
    <div class="hero"><div><small>Simple Training App</small><h1>Nick's Workout Tracker</h1></div><div style="font-size:34px">🏋️</div></div>
    <main id="app"></main>
  </div>
<script>
const STORAGE_KEY = 'nick_simple_workout_tracker_v3';
const workouts = {
 day1:{title:'Day 1',subtitle:'Push + Posterior Chain',bestFor:'RecPlex or work gym',restDefault:90,focus:'Chest, rows, hamstrings, glutes, lower back, pull-up path',exercises:[
  ex('Incline Walk + Hip Openers','warmup','8 min',1,30,'Easy pace. Open hips, loosen back, get warm without rushing.'),
  ex('Leg Press','strength','3 x 10–12',3,90,'For glute emphasis, place feet a little higher and wider. Control the bottom.'),
  ex('Chest Press Machine','strength','3 x 8–12',3,90,'Smooth reps. Stop 1–2 reps before form breaks.'),
  ex('Seated Row','strength','3 x 10–12',3,75,'Pull elbows back. Squeeze shoulder blades. Do not shrug.'),
  ex('RDL / DB RDL','posterior','3 x 8–10',3,90,'Hips back, soft knees, feel hamstrings. Keep back neutral.'),
  ex('Assisted Pull-up / Lat Pulldown','pullup','3 x 8–10',3,90,'Track assistance if using assisted machine. Goal over time: same reps with less assistance.'),
  ex('45° Back Extension','posterior','3 rounds: 20–30 sec hold + 8 reps',3,60,'Glute squeeze. Think long spine, not lower-back cranking.'),
  ex('Farmer Carry','carry','3 trips',3,60,'Tall posture, ribs down, strong grip. Track dumbbell weight and trip length in notes.'),
  ex('Incline Walk Finish','conditioning','10 min',1,30,'Easy/moderate. Leave feeling better, not smoked.')
 ]},
 day2:{title:'Day 2',subtitle:'Glute/Hamstring + Upper Back',bestFor:'Best Angie day',restDefault:90,focus:'Glutes, hamstrings, upper back, core, hips',exercises:[
  ex('Bike or Incline Walk Warm-Up','warmup','5–8 min',1,30,'Just enough to warm knees, hips, and back.'),
  ex('Hip Thrust / Glute Bridge','posterior','3 x 10–12',3,90,'Main lift today. Full lockout, controlled lower. Angie version: make this the priority lift.'),
  ex('Lat Pulldown','pullup','3 x 10–12',3,75,'Use a grip that feels good. Pull elbows to ribs.'),
  ex('Split Squat / Walking Lunge','posterior','2–3 x 8–12 each leg',3,90,'Slight forward lean to bias glutes. Use support if needed.'),
  ex('Incline Press / Push-Up','strength','3 x 8–12',3,75,'Keep this clean and moderate. It supports chest without making today a chest day.'),
  ex('Face Pulls','mobility-strength','3 x 12–15',3,60,'Upper back and shoulder health. Slow reps.'),
  ex('Hamstring Curl Machine','posterior','3 x 10–12',3,75,'Control the negative. Strong hamstring focus.'),
  ex('Core: Dead Bug or Hanging Knee Raise','core','3 x 8–15',3,60,'Ribs down. Move slow. Stop before hip flexors take over.'),
  ex('Optional Glute Finisher','posterior','2 x 15–20',2,45,'Hip abductor machine, cable kickback, or banded lateral walks.')
 ]},
 day3:{title:'Day 3',subtitle:'Strength + Athletic Conditioning',bestFor:'Friday or Saturday RecPlex',restDefault:90,focus:'Leg strength, shoulders, rows, chin-ups, core, conditioning',exercises:[
  ex('Incline Walk + Mobility','warmup','8 min',1,30,'Hip openers, cat/cow, light rows if available.'),
  ex('Heavy Leg Press / Trap Bar Deadlift','posterior','3 x 5–8',3,120,'If back feels off, choose leg press. Strong but not sloppy.'),
  ex('Shoulder Press Machine','strength','3 x 8–10',3,90,'Brace core. Avoid leaning back hard.'),
  ex('Chest-Supported Row','strength','3 x 10–12',3,75,'Back builder. Squeeze and control.'),
  ex('Assisted Chin-Up','pullup','3 sets',3,90,'Track assistance. Chin-ups usually help build toward pull-ups.'),
  ex('Hamstring Curl / RDL','posterior','3 x 8–12',3,90,'Choose the one your back/hips tolerate best that day.'),
  ex('Cable Woodchop','core','3 x 10–12 each side',3,60,'Athletic core. Rotate through torso, stay controlled.'),
  ex('Conditioning Choice','conditioning','10–15 min',1,30,'Incline walk, bike, rower, sled, or something fun with Logan.')
 ]},
 home1:{title:'Home Day 1',subtitle:'Bodyweight Push + Posterior Chain',bestFor:'Gym closed / home backup',restDefault:60,focus:'Glutes, hamstrings, chest, upper back, core',exercises:[
  ex('Warm-Up Walk or March + Hip Openers','warmup','5–8 min',1,30,'Walk outside, march in place, or use stairs lightly. Add hip circles and bodyweight squats.'),
  ex('Tempo Bodyweight Squat','posterior','3 x 10–15',3,60,'Three seconds down, pause, drive up through mid-foot/heel. Add backpack if easy.'),
  ex('Glute Bridge / Single-Leg Glute Bridge','posterior','3 x 12–15',3,60,'Squeeze glutes at the top. Use single-leg reps if bodyweight is too easy.'),
  ex('Push-Up / Incline Push-Up','strength','3 x 6–12',3,60,'Hands on counter/couch if needed. Keep body straight and reps clean.'),
  ex('Backpack Row / Towel Door Row','strength','3 x 10–15',3,60,'Use a loaded backpack or a safe towel row setup. Pull elbows back and squeeze shoulder blades.'),
  ex('Hip Hinge Good Morning','posterior','3 x 12',3,60,'Hands across chest or backpack on back. Hips back, hamstring stretch, neutral spine.'),
  ex('Prone Y-T-W / Floor Back Extension Hold','mobility-strength','2–3 x 8 each',3,45,'Upper back and low-back endurance. Move slow; do not crank your neck.'),
  ex('Front Plank','core','3 x 20–45 sec',3,45,'Ribs down, glutes tight, breathe. Stop before your low back sags.'),
  ex('Easy Walk Finish','conditioning','5–10 min',1,30,'Walk outside if possible. Keep it easy and count it as keeping the habit alive.')
 ]},
 home2:{title:'Home Day 2',subtitle:'Glute/Hamstring Angie Option',bestFor:'At home with Angie',restDefault:60,focus:'Glutes, legs, hips, hamstrings, core',exercises:[
  ex('Warm-Up: Walk + Dynamic Hips','warmup','5 min',1,30,'Easy walk, hip circles, leg swings, and a few slow squats.'),
  ex('Couch Hip Thrust / Glute Bridge','posterior','4 x 10–15',4,60,'Main lift today. Shoulders on couch if comfortable. Pause hard at lockout.'),
  ex('Reverse Lunge / Split Squat','posterior','3 x 8–12 each leg',3,75,'Slight forward lean to bias glutes. Hold wall/chair for balance if needed.'),
  ex('Hamstring Walkout','posterior','3 x 6–10',3,60,'Start in bridge, slowly walk heels out and back. Big hamstring focus.'),
  ex('Frog Pump / Banded Glute Bridge','posterior','2–3 x 20',3,45,'High-rep glute burn. Feet together, knees out, squeeze at the top.'),
  ex('Side-Lying Leg Raise / Clamshell','posterior','3 x 15 each side',3,45,'Glute medius for hips and shape. Slow and controlled.'),
  ex('Dead Bug','core','3 x 8 each side',3,45,'Low back stays down. Slow reps.'),
  ex('Hip Flexor + Figure-4 Stretch','mobility','5 min',1,30,'Easy stretching. Do not force range of motion.')
 ]},
 home3:{title:'Home Day 3',subtitle:'Athletic Conditioning + Core',bestFor:'No equipment / Logan option',restDefault:45,focus:'Conditioning, legs, chest, core, mobility',exercises:[
  ex('Warm-Up: Walk / Stairs / March','warmup','5 min',1,30,'Get warm without jumping straight into intensity.'),
  ex('Step-Up / Stair Step-Up','posterior','3 x 10 each leg',3,60,'Use stairs or a sturdy step. Drive through the working leg.'),
  ex('Push-Up Ladder','strength','4 sets',4,45,'Do clean sets. Stop 1–2 reps before sloppy form.'),
  ex('Wall Sit','posterior','3 x 30–60 sec',3,60,'Quads and glutes. Keep back flat against wall.'),
  ex('Bear Crawl / Slow Mountain Climber','conditioning','3 x 20–40 sec',3,45,'Athletic core. Keep hips controlled; skip if wrists bother you.'),
  ex('Superman Hold / Bird Dog','core','3 x 8–12',3,45,'Choose bird dog if low back feels sensitive.'),
  ex('Side Plank','core','3 x 20–40 sec each side',3,45,'Waist/core stability. Quality over time.'),
  ex('Cool Down Walk + Hips','mobility','5–10 min',1,30,'Easy walk and hip flexor stretch to finish.')
 ]},
 workA:{title:'Work Morning A',subtitle:'Hip + Back Reset',bestFor:'15–20 min, no sweat',restDefault:30,focus:'Mobility, hips, lower back, light pull-up practice',exercises:[
  ex('Easy Walk','mobility','5 min',1,20,'Easy pace. Just get moving.'),ex('Hip Flexor Stretch','mobility','2 x 30 sec each',2,20,'Squeeze glute on the back leg.'),ex('Dead Bug','core','2 x 8 each',2,30,'Low back stays down.'),ex('Dead Hang / Scap Pull','pullup','2–3 easy sets',3,30,'Stop before grip fails. Build the habit.'),ex('Cat/Cow + Breathing','mobility','2 min',1,20,'Loosen spine and slow down before work.')
 ]},
 workB:{title:'Work Morning B',subtitle:'Glute Activation + Walk',bestFor:'15–20 min, no sweat',restDefault:30,focus:'Glutes, hips, posture',exercises:[
  ex('Easy Walk','mobility','5 min',1,20,'Easy pace.'),ex('Glute Bridge','posterior','2 x 12–15',2,30,'Pause and squeeze at the top.'),ex('Banded Lateral Walk','posterior','2 x 10 each way',2,30,'Small controlled steps.'),ex('Bird Dog','core','2 x 8 each',2,30,'Slow and stable.'),ex('Pigeon or Figure-4 Stretch','mobility','2 x 30 sec each',2,20,'Do not force it.')
 ]},
 workC:{title:'Work Morning C',subtitle:'Upper Back + Hips',bestFor:'15–20 min, no sweat',restDefault:30,focus:'Posture, shoulders, hips',exercises:[
  ex('Easy Walk','mobility','5 min',1,20,'Easy pace.'),ex('Band Pull-Apart / Face Pull','mobility-strength','2 x 15',2,30,'Shoulders down and back.'),ex('Deep Squat Hold','mobility','2 x 30 sec',2,30,'Use a rack or doorframe for support.'),ex('Side Plank','core','2 x 20–30 sec each',2,30,'Build waist/core strength without crunching.'),ex('Thoracic Rotation','mobility','2 x 8 each',2,20,'Open upper back.')
 ]}
};
const order=['day1','day2','day3','home1','home2','home3','workA','workB','workC'];
function ex(name,type,target,sets,rest,notes){return {name,type,target,sets,rest,notes};}
let appState=loadState(), screen='home', selectedWorkout='day1', exerciseIndex=0, session=null, timer=null, seconds=90, running=false, deferredPrompt=null;
window.addEventListener('beforeinstallprompt', (e)=>{ e.preventDefault(); deferredPrompt=e; render(); });
if ('serviceWorker' in navigator) { window.addEventListener('load', ()=> navigator.serviceWorker.register('./service-worker.js').catch(()=>{})); }
function loadState(){try{return JSON.parse(localStorage.getItem(STORAGE_KEY))||{sessions:[]}}catch{return {sessions:[]}}}
function saveState(){localStorage.setItem(STORAGE_KEY,JSON.stringify(appState));}
function blankSets(n){return Array.from({length:n||3},(_,i)=>({setNumber:i+1,weight:'',reps:'',rpe:'',status:'open'}));}
function getHistory(name){let rows=[];(appState.sessions||[]).forEach(s=>(s.entries||[]).forEach(e=>{if(e.exerciseName===name&&!e.skipped)rows.push({...e,sessionDate:s.date,workoutTitle:s.workoutTitle})}));return rows.sort((a,b)=>new Date(b.sessionDate)-new Date(a.sessionDate));}
function rec(exercise){const last=getHistory(exercise.name)[0]; if(!last) return 'Start conservative today. Pick a weight where you could do 2 more clean reps.'; const done=(last.sets||[]).filter(s=>s.status==='done'); if(!done.length)return 'No completed sets last time. Repeat the setup and keep it easy.'; const reps=done.map(s=>Number(s.reps||0)); const weights=done.map(s=>Number(s.weight||0)).filter(w=>w>0); const minReps=Math.min(...reps); const maxW=weights.length?Math.max(...weights):0; const avg=done.reduce((a,s)=>a+Number(s.rpe||0),0)/done.length; const m=(exercise.target||'').match(/[–-](\d+)/); const upper=m?Number(m[1]):12; if(exercise.type==='pullup') return 'Progress by getting the same reps with slightly less assistance, or one extra rep with the same assistance.'; if(['warmup','mobility','conditioning'].includes(exercise.type)) return 'Keep this easy and consistent. This is for the habit, hips, and recovery.'; if(minReps>=upper&&avg<=8&&maxW>0)return `Last time you hit the top of the range. Try a small increase from ${maxW} next time.`; if(avg>=9)return `Last time felt hard. Stay near ${maxW||'the same weight'} and clean up the reps.`; return `Repeat around ${maxW||"last time's weight"} and try to add 1 clean rep somewhere.`;}
function stats(){const sessions=appState.sessions||[]; const sets=sessions.flatMap(s=>s.entries||[]).flatMap(e=>e.sets||[]); const done=sets.filter(s=>s.status==='done'); const volume=done.reduce((sum,s)=>sum+Number(s.weight||0)*Number(s.reps||0),0); const posterior=sessions.flatMap(s=>s.entries||[]).filter(e=>['posterior','pullup'].includes(e.type)).flatMap(e=>e.sets||[]).filter(s=>s.status==='done').length; return {sessions:sessions.length,doneSets:done.length,volume:Math.round(volume),posterior};}
function startWorkout(key){selectedWorkout=key; const w=workouts[key]; exerciseIndex=0; session={id:String(Date.now()),date:new Date().toISOString(),workoutKey:key,workoutTitle:`${w.title} - ${w.subtitle}`,entries:w.exercises.map(x=>({exerciseName:x.name,type:x.type,target:x.target,notes:'',skipped:false,sets:blankSets(x.sets)}))}; seconds=w.exercises[0].rest||w.restDefault||90; running=false; screen='workout'; render();}
function updateSet(i,field,value){session.entries[exerciseIndex].sets[i][field]=value; render();}
function completeSet(i){session.entries[exerciseIndex].sets[i].status='done'; startRest(); render();}
function skipSet(i){session.entries[exerciseIndex].sets[i].status='skipped'; render();}
function skipExercise(){let e=session.entries[exerciseIndex]; e.skipped=true; e.sets=e.sets.map(s=>({...s,status:s.status==='done'?'done':'skipped'})); goNext();}
function goNext(){const w=workouts[selectedWorkout]; exerciseIndex=Math.min(exerciseIndex+1,w.exercises.length-1); seconds=w.exercises[exerciseIndex].rest||w.restDefault||90; running=false; stopTick(); render();}
function goPrev(){const w=workouts[selectedWorkout]; exerciseIndex=Math.max(exerciseIndex-1,0); seconds=w.exercises[exerciseIndex].rest||w.restDefault||90; running=false; stopTick(); render();}
function finish(){appState.sessions=[session,...(appState.sessions||[])].slice(0,300); saveState(); running=false; stopTick(); screen='summary'; render();}
function setTimer(s){seconds=s; running=false; stopTick(); render();}
function startRest(){const w=workouts[selectedWorkout]; const x=w.exercises[exerciseIndex]; seconds=x.rest||w.restDefault||90; running=true; tick();}
function toggleTimer(){running=!running; if(running)tick(); else stopTick(); render();}
function stopTick(){if(timer){clearInterval(timer); timer=null;}}
function tick(){stopTick(); timer=setInterval(()=>{ if(!running){stopTick();return;} seconds=Math.max(0,seconds-1); if(seconds===0){running=false; stopTick();} render(); },1000);}
async function installApp(){ if(deferredPrompt){ deferredPrompt.prompt(); await deferredPrompt.userChoice; deferredPrompt=null; render(); } }
function clearHistory(){if(confirm('Clear all saved workout history on this phone?')){appState={sessions:[]}; saveState(); render();}}
function html(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
function render(){const root=document.getElementById('app'); if(screen==='home')return renderHome(root); if(screen==='workout')return renderWorkout(root); if(screen==='summary')return renderSummary(root);}
function renderHome(root){const st=stats(); root.innerHTML=`<div class="grid4"><div class="stat"><b>${st.sessions}</b><span>Sessions</span></div><div class="stat"><b>${st.doneSets}</b><span>Sets</span></div><div class="stat"><b>${st.volume}</b><span>Volume</span></div><div class="stat"><b>${st.posterior}</b><span>Backside</span></div></div><div class="card"><div class="smallRow"><div><b>Pick today's workout</b><div class="tiny">Main lifts or quick work-morning mobility.</div></div><span class="pill">PWA</span></div>${deferredPrompt?`<button class="btn full" style="margin-top:12px" onclick="installApp()">Install App</button>`:`<div class="installBox" style="margin-top:12px"><b>Install on phone:</b><br>Open this page in Chrome, tap the ⋮ menu, then choose <b>Add to Home screen</b> or <b>Install app</b>.</div>`}${order.map(k=>{const w=workouts[k];return `<button class="workoutBtn" onclick="startWorkout('${k}')"><b>${html(w.title)}</b><span>${html(w.subtitle)}</span><small>${html(w.bestFor)}</small></button>`}).join('')}</div>${(appState.sessions||[]).length?`<div class="card"><div class="smallRow"><b>Recent Sessions</b><button class="btn secondary danger" onclick="clearHistory()">Clear</button></div>${appState.sessions.slice(0,6).map(s=>`<div class="history"><b>${html(s.workoutTitle)}</b><div class="tiny">${new Date(s.date).toLocaleString()}</div></div>`).join('')}</div>`:''}`}
function renderWorkout(root){const w=workouts[selectedWorkout], x=w.exercises[exerciseIndex], entry=session.entries[exerciseIndex]; const done=session.entries.reduce((sum,e)=>sum+e.sets.filter(s=>s.status==='done').length,0); const total=session.entries.reduce((sum,e)=>sum+e.sets.length,0); const min=Math.floor(seconds/60), sec=String(seconds%60).padStart(2,'0'); root.innerHTML=`<div class="card"><div class="topbar"><button class="btn secondary" onclick="screen='home';render()">Exit</button><div class="center"><div class="label">${html(w.title)}</div><b>${html(w.subtitle)}</b></div><button class="btn" onclick="finish()">Finish</button></div><div class="progress"><div style="width:${((exerciseIndex+1)/w.exercises.length)*100}%"></div></div><div class="center tiny" style="margin-top:8px">Exercise ${exerciseIndex+1} of ${w.exercises.length} · ${done}/${total} sets done</div></div><div class="card"><div class="label">Current Exercise</div><div class="exerciseTitle">${html(x.name)}</div><div class="target">Target: ${html(x.target)}</div><p class="note">${html(x.notes)}</p><div class="guidance"><b>📈 Next-time guidance</b><br>${html(rec(x))}</div></div><div class="card"><div class="timer"><div><div class="label">Rest Timer</div><div class="time">${min}:${sec}</div></div><div class="timerBtns"><button class="round" onclick="toggleTimer()">${running?'⏸':'▶'}</button><button class="round" onclick="setTimer(${x.rest||w.restDefault||90})">↻</button></div></div><div class="chips"><button class="chip" onclick="setTimer(60)">60s</button><button class="chip" onclick="setTimer(90)">90s</button><button class="chip" onclick="setTimer(120)">120s</button></div></div><div>${entry.sets.map((s,i)=>`<div class="set ${s.status==='done'?'done':s.status==='skipped'?'skipped':''}"><div class="setHead"><b>Set ${s.setNumber}</b><span class="tiny">${s.status}</span></div><div class="inputs"><label>Weight<input inputmode="decimal" placeholder="lb" value="${html(s.weight)}" oninput="updateSet(${i},'weight',this.value)"></label><label>Reps<input inputmode="numeric" placeholder="#" value="${html(s.reps)}" oninput="updateSet(${i},'reps',this.value)"></label><label>RPE<input inputmode="numeric" placeholder="1-10" value="${html(s.rpe)}" oninput="updateSet(${i},'rpe',this.value)"></label></div><div class="actions2"><button class="btn ok" onclick="completeSet(${i})">✓ Done</button><button class="btn secondary" onclick="skipSet(${i})">Skip</button></div></div>`).join('')}</div><div class="nav3"><button class="btn secondary" ${exerciseIndex===0?'disabled':''} onclick="goPrev()">Back</button><button class="btn secondary" onclick="skipExercise()">Skip Ex.</button>${exerciseIndex===w.exercises.length-1?`<button class="btn" onclick="finish()">Done</button>`:`<button class="btn" onclick="goNext()">Next</button>`}</div>`;}
function renderSummary(root){root.innerHTML=`<div class="card center"><div class="completeIcon">✓</div><div class="exerciseTitle">Workout Saved</div><div class="tiny">${html(session.workoutTitle)}</div><p class="note">Next time, the app will look at what you finished today and suggest whether to repeat, add reps, or increase weight.</p></div><button class="btn full" onclick="screen='home';render()">Back to Home</button>`;}
render();
</script>
</body>
</html>
